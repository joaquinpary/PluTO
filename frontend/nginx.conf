# The front end: the React build, with /api/ proxied to Django (gunicorn).
server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/csv;

    # Docker's DNS, asked again every 10 s: a recreated server container gets a
    # new address, and a name resolved once at startup would then give 502s.
    resolver 127.0.0.11 valid=10s;
    set $django http://server:8000;

    location /api/ {
        proxy_pass $django;
        # Django only answers the hosts it allows, and "server" always is
        # (PLUTO_API_URL, pluto/settings.py), whatever address the browser used.
        proxy_set_header Host server;
        # Launching a plugin builds its image the first time: it takes minutes.
        proxy_read_timeout 600s;
        # The coordinates file is up to 1 MiB, plus the multipart envelope.
        client_max_body_size 2m;
    }

    # Vite puts a content hash in every file name under /assets/.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Every other path is a route of the app (/plugins, /boards/...).
    location / {
        try_files $uri /index.html;
    }

    # Never cached, so the next load picks up a new build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
