server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/csv;

    # Re-resolve every 10 s: a recreated server container gets a new IP (else 502s).
    resolver 127.0.0.11 valid=10s;
    set $django http://server:8000;

    location /api/ {
        proxy_pass $django;
        # "server" is always in Django's ALLOWED_HOSTS (PLUTO_API_URL).
        proxy_set_header Host server;
        # A plugin's first launch builds its image: minutes.
        proxy_read_timeout 600s;
        # 1 MiB coordinates file plus multipart overhead.
        client_max_body_size 2m;
    }

    # Vite puts a content hash in every file name under /assets/.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        try_files $uri /index.html;
    }

    # Never cached, so the next load picks up a new build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
