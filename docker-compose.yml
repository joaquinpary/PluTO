services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DB: ${MONGO_DB:-pluto}
      MONGO_USERNAME: ${MONGO_USERNAME:-}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_USERNAME: ${MQTT_USERNAME:-pluto}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-change-me}
    depends_on:
      - mongodb
      - mosquitto
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    restart: unless-stopped
    networks:
      - pluto-network
      - docker-proxy

  coord_transform:
    build:
      context: ./services/coord_transform
      dockerfile: Dockerfile
    environment:
      MQTT_BROKER_URL: mosquitto
      MQTT_BROKER_PORT: 1883
      MQTT_USERNAME: ${MQTT_USERNAME:-pluto}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-change-me}
    volumes:
      - ./services/coord_transform:/app
    depends_on:
      - mosquitto
    restart: unless-stopped

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    networks:
      - pluto-network

  mosquitto:
    image: eclipse-mosquitto:2
    entrypoint: ["/bin/sh", "/usr/local/bin/mosquitto-entrypoint.sh"]
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-pluto}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-change-me}
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/entrypoint.sh:/usr/local/bin/mosquitto-entrypoint.sh:ro
    restart: unless-stopped
    networks:
      - pluto-network

  dockerproxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    environment:
      - CONTAINERS=1
      - POST=1
      - DELETE=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - pluto-network
      - docker-proxy

volumes:
  mongo-data:
networks:
  pluto-network:
    name: pluto-network
    driver: bridge
  docker-proxy:
    name: docker-proxy
    driver: bridge
    internal: true
