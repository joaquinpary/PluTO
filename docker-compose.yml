x-django-env: &django-env
  SECRET_KEY: ${SECRET_KEY:-change-me}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-pluto}
  POSTGRES_USER: ${POSTGRES_USER:-pluto}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
  MQTT_HOST: mosquitto
  MQTT_PORT: 1883
  MQTT_USERNAME: ${MQTT_USERNAME:-pluto}
  MQTT_PASSWORD: ${MQTT_PASSWORD:-change-me}

services:
  server:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: pluto/server:latest
    # gunicorn, not runserver: the front end polls every second while the
    # plugins ingest. Launching a plugin builds its image the first time and can
    # take minutes, hence the 600 s timeout, the same as nginx's.
    command: sh -c "python manage.py migrate --noinput && exec gunicorn pluto.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 4 --timeout 600"
    environment: *django-env
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    # Only for working on this same machine. From the LAN, PluTO is the web container.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - ./plugins:/plugins
    restart: unless-stopped
    networks:
      - pluto-network
      - docker-proxy


  # The front end: nginx serves the React build and proxies /api/ to the
  # server. The only port the LAN needs; the phone gets in through it.
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: pluto/web:latest
    ports:
      - "${PLUTO_WEB_PORT:-80}:80"
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - pluto-network

  # POST /transform for the plugins, inside pluto-network only: no port published.
  coord_transform:
    build:
      context: ./services/coord_transform
      dockerfile: Dockerfile
    volumes:
      - ./services/coord_transform:/app
    restart: unless-stopped
    networks:
      - pluto-network

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pluto}
      POSTGRES_USER: ${POSTGRES_USER:-pluto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    # No published port: services reach it on pluto-network. For a shell use
    #   docker compose exec postgres psql -U pluto pluto
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - pluto-network

  mosquitto:
    image: eclipse-mosquitto:2
    entrypoint: ["/bin/sh", "/usr/local/bin/mosquitto-entrypoint.sh"]
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-pluto}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-change-me}
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/entrypoint.sh:/usr/local/bin/mosquitto-entrypoint.sh:ro
    restart: unless-stopped
    networks:
      - pluto-network

  dockerproxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    environment:
      - CONTAINERS=1
      - BUILD=1
      - IMAGES=1
      - POST=1
      - DELETE=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - pluto-network
      - docker-proxy

volumes:
  postgres-data:
networks:
  pluto-network:
    name: pluto-network
    driver: bridge
  docker-proxy:
    name: docker-proxy
    driver: bridge
    internal: true
