x-django-env: &django-env
  SECRET_KEY: ${SECRET_KEY:-change-me}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-pluto}
  POSTGRES_USER: ${POSTGRES_USER:-pluto}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
  MQTT_HOST: mosquitto
  MQTT_PORT: 1883
  MQTT_USERNAME: ${MQTT_USERNAME:-pluto}
  MQTT_PASSWORD: ${MQTT_PASSWORD:-change-me}

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: pluto/server:latest
    # Migrating on start is what creates plugin_data, which mqtt_ingest waits for.
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    environment: *django-env
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    restart: unless-stopped
    networks:
      - pluto-network
      - docker-proxy

  # Same image and code as the server, run as a second process: the MQTT loop
  # can't live inside runserver, whose autoreloader would run it twice.
  mqtt_ingest:
    build:
      context: .
      dockerfile: Dockerfile
    image: pluto/server:latest
    command: python manage.py mqtt_ingest
    environment: *django-env
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped
    networks:
      - pluto-network

  # The other half of the MQTT core: turns the plugins' trajectories into the
  # binary batches the board executes. Separate process from the ingester so a
  # slow database write on one side never delays the other's setpoints.
  mqtt_dispatch:
    build:
      context: .
      dockerfile: Dockerfile
    image: pluto/server:latest
    command: python manage.py mqtt_dispatch
    environment: *django-env
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    restart: unless-stopped
    networks:
      - pluto-network

  coord_transform:
    build:
      context: ./services/coord_transform
      dockerfile: Dockerfile
    environment:
      MQTT_BROKER_URL: mosquitto
      MQTT_BROKER_PORT: 1883
      MQTT_USERNAME: ${MQTT_USERNAME:-pluto}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-change-me}
    volumes:
      - ./services/coord_transform:/app
    depends_on:
      - mosquitto
    restart: unless-stopped
    networks:
      - pluto-network

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pluto}
      POSTGRES_USER: ${POSTGRES_USER:-pluto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    # No published port: services reach it on pluto-network. For a shell use
    #   docker compose exec postgres psql -U pluto pluto
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - pluto-network

  mosquitto:
    image: eclipse-mosquitto:2
    entrypoint: ["/bin/sh", "/usr/local/bin/mosquitto-entrypoint.sh"]
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-pluto}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-change-me}
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/entrypoint.sh:/usr/local/bin/mosquitto-entrypoint.sh:ro
    restart: unless-stopped
    networks:
      - pluto-network

  dockerproxy:
    image: tecnativa/docker-socket-proxy:v0.4.2
    environment:
      - CONTAINERS=1
      - BUILD=1
      - IMAGES=1
      - POST=1
      - DELETE=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - pluto-network
      - docker-proxy

volumes:
  postgres-data:
networks:
  pluto-network:
    name: pluto-network
    driver: bridge
  docker-proxy:
    name: docker-proxy
    driver: bridge
    internal: true
